<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos de reserva · Cumple · Snack Bowling</title>
<meta name="description" content="Completá los datos de tu cumple en Snack Bowling y los recibimos por WhatsApp.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f3ea">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root {
    --paper: #f6f3ea;
    --paper-2: #ece6d3;
    --ink: #14110d;
    --ink-2: #4b4536;
    --ink-3: #8a8473;
    --accent: #E63329;
    --wp: #25D366;
    --wp-dark: #128c7e;
    --font-ui: "Archivo", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --font-serif: "Fraunces", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.4;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  .brand {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 22px;
  }
  .brand img {
    height: 56px;
    width: auto;
    filter: brightness(0) saturate(100%) invert(22%) sepia(93%) saturate(2000%) hue-rotate(350deg) brightness(95%) contrast(95%);
  }
  .brand a { text-decoration: none; display: inline-flex; }
  h1 {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: 32px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 8px 0 6px;
  }
  .sub {
    color: var(--ink-2);
    font-size: 15px;
    margin: 0 0 24px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  label {
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.01em;
    color: var(--ink);
  }
  .hint {
    font-weight: 400;
    color: var(--ink-3);
    font-size: 12px;
    margin-left: 4px;
  }
  input[type="text"],
  input[type="number"],
  input[type="date"],
  input[type="time"],
  textarea,
  select {
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    padding: 11px 13px;
    outline: none;
    transition: box-shadow .15s, border-color .15s;
    width: 100%;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(230, 51, 41, 0.15);
  }
  textarea { min-height: 70px; resize: vertical; }
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 420px) {
    .row { grid-template-columns: 1fr; }
  }
  .radios {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .radio-chip {
    flex: 1;
    min-width: 120px;
    position: relative;
  }
  .radio-chip input { position: absolute; opacity: 0; pointer-events: none; }
  .radio-chip span {
    display: block;
    text-align: center;
    padding: 11px 10px;
    border: 1.5px solid var(--ink);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    background: #fff;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .radio-chip input:checked + span {
    background: var(--ink);
    color: var(--paper);
  }
  .radio-chip input:focus-visible + span {
    box-shadow: 0 0 0 3px rgba(230, 51, 41, 0.3);
  }
  .submit {
    margin-top: 12px;
    background: var(--wp);
    color: #fff;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: 14px 20px;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .1s, box-shadow .1s, background .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .submit:hover {
    background: var(--wp-dark);
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .submit:active {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0 var(--ink);
  }
  .submit svg { width: 20px; height: 20px; }
  .footer {
    margin-top: 20px;
    color: var(--ink-3);
    font-size: 12px;
    text-align: center;
  }
  .footer a { color: var(--ink-2); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <a href="/" aria-label="Snack Bowling">
        <img src="assets/logo-snack.webp" alt="Snack Bowling" width="120" height="36">
      </a>
    </div>

    <h1>Datos del cumple</h1>
    <p class="sub">Completá los datos y nos llegan directo por WhatsApp.</p>

    <form id="form-reserva" novalidate>
      <div class="row">
        <div class="field">
          <label for="cantCumple">Cantidad de cumpleañeros</label>
          <input type="number" id="cantCumple" name="cantCumple" min="1" max="20" inputmode="numeric" required>
        </div>
        <div class="field">
          <label for="edad">Edad</label>
          <input type="number" id="edad" name="edad" min="1" max="99" inputmode="numeric" required>
        </div>
      </div>

      <div class="field">
        <label for="nombres">Nombre del/los cumpleañero/s</label>
        <input type="text" id="nombres" name="nombres" placeholder="Ej: Juan y Sofía" required>
      </div>

      <div class="field">
        <label>Paquete</label>
        <div class="radios" role="radiogroup" aria-label="Paquete">
          <label class="radio-chip">
            <input type="radio" name="paquete" value="Base" required>
            <span>Base</span>
          </label>
          <label class="radio-chip">
            <input type="radio" name="paquete" value="Full" required>
            <span>Full</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="menu">Menú de comida</label>
        <select id="menu" name="menu" required>
          <option value="">Elegí…</option>
          <option value="Hamburguesa">Hamburguesa</option>
          <option value="Pizza">Pizza</option>
          <option value="Panchos">Panchos</option>
          <option value="Patitas (solo Full)">Patitas (solo Full)</option>
        </select>
      </div>

      <div class="field">
        <label for="cantChicos">Cantidad de chicos</label>
        <input type="number" id="cantChicos" name="cantChicos" min="1" max="200" inputmode="numeric" required>
      </div>

      <div class="row">
        <div class="field">
          <label for="dia">Día</label>
          <input type="date" id="dia" name="dia" required>
        </div>
        <div class="field">
          <label for="horario">Horario</label>
          <input type="time" id="horario" name="horario" required>
        </div>
      </div>

      <div class="field">
        <label for="colegio">Colegio</label>
        <input type="text" id="colegio" name="colegio" required>
      </div>

      <div class="field">
        <label for="celiacos">Niños celíacos <span class="hint">(cantidad y nombre si querés)</span></label>
        <textarea id="celiacos" name="celiacos" placeholder="Ej: 1 — Mateo. O: ninguno"></textarea>
      </div>

      <button type="submit" class="submit">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.52 3.48A11.9 11.9 0 0 0 12.03 0C5.42 0 .06 5.37.06 11.98c0 2.11.55 4.17 1.6 5.98L0 24l6.22-1.63a11.96 11.96 0 0 0 5.8 1.48h.01c6.6 0 11.97-5.37 11.97-11.98 0-3.2-1.25-6.2-3.48-8.39ZM12.03 21.8h-.01a9.86 9.86 0 0 1-5.03-1.38l-.36-.21-3.69.97.99-3.59-.24-.37a9.84 9.84 0 0 1-1.51-5.24c0-5.46 4.44-9.9 9.86-9.9 2.63 0 5.1 1.03 6.96 2.9a9.78 9.78 0 0 1 2.88 6.98c0 5.46-4.44 9.84-9.85 9.84Zm5.4-7.37c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.6.14-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.6-.91-2.2-.24-.58-.49-.5-.67-.51l-.57-.01c-.2 0-.52.07-.8.37-.27.3-1.05 1.02-1.05 2.5s1.08 2.9 1.23 3.1c.15.2 2.12 3.23 5.14 4.53.72.31 1.28.5 1.72.63.72.23 1.37.2 1.89.12.58-.09 1.75-.72 2-1.41.24-.7.24-1.3.17-1.41-.07-.12-.27-.2-.57-.35Z"/></svg>
        Enviar por WhatsApp
      </button>
    </form>

    <p class="footer">
      <a href="/">← Volver al inicio</a>
    </p>
  </div>

<script>
  const WP_NUMBER = '541168225209';
  const form = document.getElementById('form-reserva');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    const data = Object.fromEntries(new FormData(form).entries());

    const formatearFecha = (iso) => {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    };

    const lineas = [
      'DATOS CUMPLE',
      '',
      `-Cantidad de cumpleañeros: ${data.cantCumple}`,
      `-Nombre del/los cumpleañero: ${data.nombres}`,
      `-Paquete: ${data.paquete}`,
      `-Menú de comida: ${data.menu}`,
      `-Cantidad de chicos: ${data.cantChicos}`,
      `-Horario y Dia: ${data.horario} · ${formatearFecha(data.dia)}`,
      `-Colegio: ${data.colegio}`,
      `-Edad: ${data.edad}`,
      `-Niños celiacos: ${(data.celiacos || '').trim() || 'ninguno'}`
    ];

    const texto = encodeURIComponent(lineas.join('\n'));
    const url = `https://api.whatsapp.com/send?phone=${WP_NUMBER}&text=${texto}`;
    window.location.href = url;
  });
</script>
</body>
</html>
